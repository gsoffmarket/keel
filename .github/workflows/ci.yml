name: CI

# Runs the full test suite on every push and pull request. The tests use local fakes
# for Hyperliquid and Polymarket, so CI needs no network access to any exchange and no
# secrets; the workflow has read-only repository permissions.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }}${{ matrix.extras && format(', {0}', matrix.extras) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        extras: [""]
        include:
          - python: "3.12"
            extras: "parquet"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.extras }}" ]; then pip install -e ".[dev,${{ matrix.extras }}]"; else pip install -e ".[dev]"; fi
      - name: Read-only invariants
        run: python -m pytest -q tests/test_safety_invariants.py
      - name: Test suite
        run: python -m pytest -q
      - name: CLI smoke test (offline)
        run: |
          cd "$(mktemp -d)"
          keel init
          keel doctor --offline || test $? -eq 2
          keel health --once health.html
          test -s health.html
