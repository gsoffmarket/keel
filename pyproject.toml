[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.1.0"
description = "Research-first quantitative system for Outcome (HIP-4) prediction markets on Hyperliquid. Read-only recorder and research engine; no keys, no orders."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "George", email = "gekere615@gmail.com" }]
keywords = ["hyperliquid", "hip-4", "outcome", "prediction-markets", "polymarket", "market-data", "quant", "research", "backtesting", "market-microstructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# The recorder runs on the standard library alone, so it starts on a fresh machine
# with no installs. Optional extras add faster or columnar storage.
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/gsoffmarket/keel"
Documentation = "https://github.com/gsoffmarket/keel/tree/main/docs"
Issues = "https://github.com/gsoffmarket/keel/issues"
Changelog = "https://github.com/gsoffmarket/keel/blob/main/CHANGELOG.md"

[project.scripts]
keel = "keel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
